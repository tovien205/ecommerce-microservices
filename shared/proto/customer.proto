syntax = "proto3";

package customer;

service CustomerService {
  rpc GetCustomer (GetCustomerRequest) returns (CustomerResponse);
  rpc CreateCustomer (CreateCustomerRequest) returns (CustomerResponse);
  rpc UpdateScore (UpdateScoreRequest) returns (CustomerResponse);
}

message GetCustomerRequest {
  string customerId = 1;
}

message CreateCustomerRequest {
  string id = 1;
  string userId = 2;
  string fullName = 3;
  string email = 4;
  string phone = 5;
}

message UpdateScoreRequest {
  string customerId = 1;
  int32 scoreDelta = 2;
}

message CustomerResponse {
  string id = 1;
  string userId = 2;
  string fullName = 3;
  string email = 4;
  string phone = 5;
  string membershipTier = 6;
  int32 score = 7;
}