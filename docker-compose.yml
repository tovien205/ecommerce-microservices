networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

services:
  # ---------------------------------------------------------------------------
  # 1. HẠ TẦNG DỮ LIỆU & MESSAGE BROKER
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb:
    image: mongo:6.0
    container_name: ecommerce-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: app_user
      MONGO_INITDB_ROOT_PASSWORD: change_me
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u app_user -p change_me --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecommerce-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecommerce-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ecommerce-network

  # ---------------------------------------------------------------------------
  # 2. CORE MICROSERVICES
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: auth-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://app_user:change_me@postgres:5432/auth_db"
      AUTH_DATABASE_URL: "postgresql://app_user:change_me@postgres:5432/auth_db"
      JWT_SECRET: "super_secret_jwt_key_ecommerce_2026"
      JWT_EXPIRES_IN: "1d"
      CUSTOMER_GRPC_HOST: "customer-service:50051"
    networks:
      - ecommerce-network

  customer-service:
    build:
      context: .
      dockerfile: ./services/customer-service/Dockerfile
    container_name: customer-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      GRPC_PORT: 50051
      DATABASE_URL: "postgresql://app_user:change_me@postgres:5432/customer_db"
      CUSTOMER_DATABASE_URL: "postgresql://app_user:change_me@postgres:5432/customer_db"
    networks:
      - ecommerce-network

  product-service:
    build:
      context: .
      dockerfile: ./services/product-service/Dockerfile
    container_name: product-service
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3003
      GRPC_PORT: 50052
      MONGO_URI: "mongodb://app_user:change_me@mongodb:27017/product_db?authSource=admin"
    networks:
      - ecommerce-network

  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    container_name: order-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
    environment:
      PORT: 3004
      DATABASE_URL: "postgresql://app_user:change_me@postgres:5432/order_db"
      ORDER_DATABASE_URL: "postgresql://app_user:change_me@postgres:5432/order_db"
      KAFKA_BROKERS: "kafka:9092"
      CUSTOMER_GRPC_URL: "customer-service:50051"
      PRODUCT_GRPC_URL: "product-service:50052"
    networks:
      - ecommerce-network

  shipment-service:
    build:
      context: ./services/shipment-service
      dockerfile: Dockerfile
    container_name: shipment-service
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 3005
      MONGO_URI: "mongodb://app_user:change_me@mongodb:27017/shipment_db?authSource=admin"
      KAFKA_BROKERS: "kafka:9092"
    networks:
      - ecommerce-network

  # ---------------------------------------------------------------------------
  # 3. API GATEWAY (Public Entrypoint)
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      shipment-service:
        condition: service_started
    environment:
      PORT: 3000
      JWT_SECRET: "super_secret_jwt_key_ecommerce_2026"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: "http://auth-service:3001"
      CUSTOMER_SERVICE_URL: "http://customer-service:3002"
      PRODUCT_SERVICE_URL: "http://product-service:3003"
      ORDER_SERVICE_URL: "http://order-service:3004"
      SHIPMENT_SERVICE_URL: "http://shipment-service:3005"
    networks:
      - ecommerce-network